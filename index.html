<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Assignment Tracker</h1>
    <p class="subtitle">Keep track of what's due and what's done.</p>

    <form id="assignment-form">
      <input type="text" id="title-input" placeholder="Assignment name" required>
      <input type="date" id="date-input" required>
      <button type="submit">Add</button>
    </form>

    <p id="summary" class="summary"></p>

    <ul id="assignment-list"></ul>

    <p id="empty-message" class="empty">No assignments yet. Add one above!</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
